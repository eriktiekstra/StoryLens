[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "storylens"
version = "0.10.0"
description = "Local-first, read-only media indexing and analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Pillow>=11,<13", "numpy>=1.26,<3"]

[project.optional-dependencies]
heif = ["pillow-heif>=1,<2"]
semantic = ["torch>=2.6,<3", "transformers>=4.57,<5", "sentencepiece>=0.2,<0.3", "safetensors>=0.5,<1", "protobuf>=4.25,<8"]
transcription = ["faster-whisper>=1.1,<2"]
model-installer = ["huggingface-hub>=0.34,<1"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
storylens = "storylens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storylens = ["schemas/*.json"]
